<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>MAFIA — Multiplayer</title><link rel="stylesheet" href="style.css"></head><body><div class="bg"></div><main><header><div class="logo">MAFIA<span>•</span></div><div class="sub">لعبة المافيا — Multiplayer</div></header>
<section id="home" class="panel"><h1>من هو المافيا؟</h1><p class="muted">أنشئ غرفة وشارك الكود مع أصحابك.</p><input id="name" maxlength="20" autocomplete="nickname" placeholder="اسمك"><div class="settings"><label>عدد اللاعبين <select id="maxPlayers"><option>4</option><option>5</option><option>6</option><option selected>8</option><option>10</option><option>12</option><option>16</option></select></label></div><div class="row"><button id="create">إنشاء غرفة</button><div class="joinbox"><input id="code" maxlength="6" autocomplete="off" placeholder="كود الغرفة"><button id="join">دخول</button></div></div><div id="error" class="error"></div></section>
<section id="lobby" class="panel hidden"><div class="roomhead"><div><small>كود الغرفة</small><strong id="roomCode"></strong></div><button class="secondary" id="copy">نسخ</button></div><h2>اللاعبون <span id="count"></span></h2><div id="players" class="players"></div><div id="hostControls"></div><button class="secondary leave" id="leave">🚪 مغادرة</button></section>
<section id="game" class="panel hidden"><div class="phase"><span id="phaseText">🌙 الليل</span><strong id="phaseTimer"></strong></div><div id="roleCard" class="rolecard"><div id="roleIcon" class="roleIcon">🎴</div><div class="roleTitle">بطاقتك السرية</div><div id="roleName">...</div><div id="roleDesc" class="muted"></div></div><div id="notice" class="notice">استعد...</div><h2>اللاعبون</h2><div id="gamePlayers" class="players"></div><div id="hostPhase" class="hint"></div><div class="voteStatus" id="voteStatus"></div><div class="chat"><div class="chathead"><h2 id="chatTitle">💬 الدردشة العامة</h2><button id="mafiaChat" class="secondary hidden">☠️ دردشة المافيا</button></div><div id="chatMessages" class="messages"></div><div class="chatbar"><input id="chatInput" maxlength="300" placeholder="اكتب رسالتك..."><button id="sendChat">إرسال</button></div></div><div id="result" class="end"></div><button id="rematch" class="hidden">🔄 Rematch</button></section></main><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
